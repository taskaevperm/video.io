<!DOCTYPE html>
<html>
<head>
    <title>Видео ревью</title>
    <style>
        body { font-family: Arial; max-width: 1200px; margin: 0 auto; padding: 20px; }
        #video-link { font-size: 24px; word-break: break-all; background: #f0f8ff; padding: 15px; border-radius: 8px; margin: 20px 0; }
        #comments { margin-top: 20px; }
        .comment { padding: 12px; border: 1px solid #ddd; margin: 8px 0; cursor: pointer; background: #f8f9fa; border-radius: 5px; }
        .comment:hover { background: #e9ecef; }
        button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px 0; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🎬 Видео ревью</h1>
    <div id="video-link">
        <strong>📺 Открой видео:</strong><br>
        <a href="https://disk.yandex.ru/i/UDROuFcltH69xQ" target="_blank">https://disk.yandex.ru/i/UDROuFcltH69xQ</a>
    </div>
    
    <button onclick="addComment()">📝 Добавить метку</button>
    <div id="comments"><em>Метки появятся здесь...</em></div>

    <script>
        let comments = JSON.parse(localStorage.getItem('video-comments') || '[]');
        
        function updateComments() {
            const container = document.getElementById('comments');
            if (comments.length === 0) {
                container.innerHTML = '<em>Метки появятся здесь... (пауза → время → комментарий)</em>';
                return;
            }
            container.innerHTML = `<h3>📋 ${comments.length} меток:</h3>`;
            comments.forEach((comment, i) => {
                const div = document.createElement('div');
                div.className = 'comment';
                div.innerHTML = `<strong>${i+1}. ${comment.time}:</strong> ${comment.text}`;
                container.appendChild(div);
            });
            localStorage.setItem('video-comments', JSON.stringify(comments));
        }
        
        function addComment() {
            const time = prompt('⏰ Время (например: 1:23, 0:45, 5:12):');
            const text = prompt('💬 Комментарий:');
            if (time && text && time.trim()) {
                comments.push({ time: time.trim(), text: text.trim() });
                comments.sort((a, b) => a.time.localeCompare(b.time));
                updateComments();
            }
        }
        
        updateComments();
    </script>
</body>
</html>
