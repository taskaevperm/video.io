<!DOCTYPE html>
<html>
<head>
    <title>Видео ревью</title>
    <style>
        body { font-family: Arial; max-width: 1200px; margin: 0 auto; padding: 20px; }
        iframe { width: 100%; height: 500px; border: none; }
        #comments { margin-top: 20px; }
        .comment { padding: 12px; border: 1px solid #ddd; margin: 8px 0; cursor: pointer; background: #f8f9fa; border-radius: 5px; }
        .comment:hover { background: #e9ecef; }
        button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px 0; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🎬 Видео ревью</h1>
    <iframe src="https://disk.yandex.ru/i/UDROuFcltH69xQ" allowfullscreen></iframe>
    
    <button onclick="addComment()">📝 Добавить метку (время вручную)</button>
    <div id="comments"><em>Метки появятся здесь... Введите время вручную (например 1:23)</em></div>

    <script>
        let comments = JSON.parse(localStorage.getItem('video-comments') || '[]');
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateComments() {
            const container = document.getElementById('comments');
            if (comments.length === 0) {
                container.innerHTML = '<em>Метки появятся здесь... Введите время вручную (например 1:23)</em>';
                return;
            }
            container.innerHTML = '';
            comments.forEach((comment, i) => {
                const div = document.createElement('div');
                div.className = 'comment';
                div.innerHTML = `<strong>${comment.time}:</strong> ${comment.text}`;
                div.onclick = () => alert(`Перейди к ${comment.time} в видео`);
                container.appendChild(div);
            });
            localStorage.setItem('video-comments', JSON.stringify(comments));
        }
        
        function addComment() {
            const time = prompt('Время метки (например 1:23 или 45):');
            const text = prompt('Комментарий:');
            if (time && text) {
                comments.push({ time, text: text.trim() });
                comments.sort((a, b) => a.time.localeCompare(b.time));
                updateComments();
            }
        }
        
        updateComments();
    </script>
</body>
</html>
