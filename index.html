<!DOCTYPE html>
<html>
<head>
    <title>Видео плеер</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        video { max-width: 95vw; max-height: 95vh; }
        button { position: fixed; top: 20px; left: 20px; padding: 10px; background: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <button onclick="getVideo()">▶️ Загрузить видео</button>
    <video id="player" controls style="display:none"></video>

    <script>
    async function getVideo() {
        try {
            const yandexUrl = 'https://disk.yandex.ru/i/GHbgNBARBEsI7w';
            
            // Запрос к Яндекс API за прямой ссылкой
            const apiUrl = `https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=${encodeURIComponent(yandexUrl)}`;
            const response = await fetch(apiUrl);
            const data = await response.json();
            
            document.getElementById('player').src = data.href;
            document.getElementById('player').style.display = 'block';
            document.querySelector('button').style.display = 'none';
        } catch(e) {
            alert('Ошибка загрузки. Проверь ссылку.');
        }
    }
    </script>
</body>
</html>
